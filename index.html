<!doctype html>
<html lang="cs">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Divoce! · administrace webu (ukázka)</title>
<meta name="description" content="Ukázka administrace webu dua Divoce: akce, texty a galerie.">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#1b0102">
<link rel="icon" href="favicon.ico" sizes="32x32">
<link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="assets/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+Display:ital,wdth,wght@0,62.5..100,300..700;1,62.5..100,300..700&family=Noto+Serif:ital,wdth,wght@0,62.5..100,300..700;1,62.5..100,300..700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    color-scheme: dark;
    --bg: #1b0102;
    --surface: #26070a;
    --card: #391115;
    --card-hi: #4a1a1f;
    --field: #160102;
    --pink: #fec3e8;
    --text: #fbe7f2;
    --muted: rgba(254, 195, 232, .62);
    --line: rgba(254, 195, 232, .16);
    --line-hi: rgba(254, 195, 232, .4);
    --ok: #a6e8bf;
    --warn: #ffd28a;
    --danger: #ff8597;
    --radius: 16px;
    --display: 'Noto Serif Display', serif;
    --ui: 'Inter', system-ui, sans-serif;
  }
  * { box-sizing: border-box; }
  html { background: var(--bg); }
  body {
    margin: 0;
    min-height: 100svh;
    background: var(--bg);
    color: var(--text);
    font: 15px/1.5 var(--ui);
    -webkit-font-smoothing: antialiased;
  }
  a { color: inherit; }
  button, input, textarea, select { font: inherit; color: inherit; }
  button { cursor: pointer; }
  [hidden] { display: none !important; }
  .sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); }
  svg.i { width: 20px; height: 20px; flex: none; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }

  /* demo ribbon */
  .demo {
    position: sticky; top: 0; z-index: 30;
    display: flex; justify-content: center; align-items: center; gap: 8px;
    height: 32px; padding: 0 16px;
    background: var(--pink); color: var(--bg);
    font-size: 12.5px; font-weight: 600; text-align: center; white-space: nowrap;
  }
  .demo span { overflow: hidden; text-overflow: ellipsis; }
  .demo .long { display: none; }
  @media (min-width: 700px) { .demo .long { display: inline; } }
  .demo button { border: 0; background: none; padding: 0; text-decoration: underline; font-weight: 600; }

  /* buttons */
  .btn {
    display: inline-flex; align-items: center; justify-content: center; gap: 8px;
    min-height: 44px; padding: 10px 18px;
    border: 1px solid var(--line-hi); border-radius: 999px;
    background: transparent; color: var(--pink);
    font-weight: 600; text-decoration: none; white-space: nowrap;
    transition: background .15s, border-color .15s, transform .1s;
  }
  .btn:hover { background: rgba(254, 195, 232, .08); }
  .btn:active { transform: scale(.98); }
  .btn.primary { background: var(--pink); color: var(--bg); border-color: var(--pink); }
  .btn.primary:hover { background: #ffd6ef; }
  .btn.danger { color: var(--danger); border-color: rgba(255, 133, 151, .45); }
  .btn.small { min-height: 36px; padding: 6px 14px; font-size: 14px; }
  .btn.ghost { border-color: transparent; }
  .btn:disabled { opacity: .45; cursor: default; }
  .icon-btn {
    display: inline-grid; place-items: center;
    width: 40px; height: 40px; border-radius: 50%;
    border: 1px solid var(--line); background: transparent; color: var(--pink);
  }
  .icon-btn:hover { background: rgba(254, 195, 232, .08); }

  /* ---------- login ---------- */
  .login {
    min-height: calc(100svh - 32px);
    display: grid; place-items: center;
    padding: 32px 16px;
  }
  .login__card {
    width: min(100%, 420px);
    display: flex; flex-direction: column; gap: 22px;
    text-align: center;
  }
  .login__logo { width: min(260px, 70%); margin: 0 auto 8px; }
  .login h1 { margin: 0; font: 600 34px/1 var(--display); font-stretch: extra-condensed; color: var(--pink); }
  .login p { margin: 0; color: var(--muted); }
  .who { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  .who button {
    display: flex; flex-direction: column; align-items: center; gap: 10px;
    padding: 18px 10px;
    border: 1px solid var(--line); border-radius: var(--radius);
    background: var(--surface); color: var(--text);
  }
  .who button[aria-pressed="true"] { border-color: var(--pink); background: var(--card); box-shadow: 0 0 0 3px rgba(254, 195, 232, .15); }
  .who b { font-weight: 600; }
  .who small { color: var(--muted); font-size: 12.5px; }
  .avatar {
    display: inline-grid; place-items: center;
    width: 40px; height: 40px; border-radius: 50%;
    background: var(--pink); color: var(--bg);
    font: 600 16px var(--display); font-stretch: condensed;
    flex: none;
  }
  .avatar.adela { background: #f59cc4; }
  .avatar.big { width: 56px; height: 56px; font-size: 22px; }
  .login form { display: flex; flex-direction: column; gap: 12px; text-align: left; }
  .login .hint { font-size: 13px; text-align: center; }

  /* ---------- form fields ---------- */
  .field { display: flex; flex-direction: column; gap: 6px; }
  .field > span { font-size: 13px; font-weight: 600; color: var(--pink); letter-spacing: .02em; }
  .field small { color: var(--muted); font-size: 12.5px; }
  .input, .textarea, .select {
    width: 100%;
    min-height: 46px;
    padding: 11px 14px;
    border: 1px solid var(--line); border-radius: 12px;
    background: var(--field); color: var(--text);
    font-size: 16px; /* no zoom on iOS */
    outline: none;
    transition: border-color .15s, box-shadow .15s;
  }
  .textarea { min-height: 120px; resize: vertical; line-height: 1.55; }
  .input:focus, .textarea:focus, .select:focus { border-color: var(--pink); box-shadow: 0 0 0 3px rgba(254, 195, 232, .14); }
  .select { appearance: none; background-image: linear-gradient(45deg, transparent 50%, var(--pink) 50%), linear-gradient(135deg, var(--pink) 50%, transparent 50%); background-position: calc(100% - 20px) 50%, calc(100% - 15px) 50%; background-size: 5px 5px; background-repeat: no-repeat; padding-right: 36px; }
  .input-suffix { position: relative; }
  .input-suffix .input { padding-right: 46px; }
  .input-suffix i { position: absolute; right: 14px; top: 50%; translate: 0 -50%; font-style: normal; color: var(--muted); }
  .grid2 { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 200px), 1fr)); gap: 14px; }
  .counter { align-self: flex-end; font-size: 12px; color: var(--muted); }
  .counter.over { color: var(--warn); }

  .switch { display: flex; align-items: center; justify-content: space-between; gap: 16px; padding: 12px 0; cursor: pointer; }
  .switch + .switch { border-top: 1px solid var(--line); }
  .switch b { display: block; font-weight: 600; }
  .switch small { color: var(--muted); font-size: 13px; }
  .switch input { appearance: none; flex: none; width: 48px; height: 28px; border-radius: 99px; background: var(--card-hi); position: relative; cursor: pointer; transition: background .2s; margin: 0; }
  .switch input::after { content: ""; position: absolute; top: 3px; left: 3px; width: 22px; height: 22px; border-radius: 50%; background: var(--muted); transition: translate .2s, background .2s; }
  .switch input:checked { background: var(--pink); }
  .switch input:checked::after { translate: 20px 0; background: var(--bg); }

  .seg { display: inline-flex; padding: 4px; border-radius: 999px; background: var(--surface); border: 1px solid var(--line); }
  .seg button { border: 0; background: none; padding: 7px 16px; border-radius: 999px; color: var(--muted); font-weight: 600; font-size: 14px; }
  .seg button[aria-pressed="true"] { background: var(--pink); color: var(--bg); }

  /* ---------- shell ---------- */
  .shell { min-height: calc(100svh - 32px); }
  .side { display: none; }
  .top {
    position: sticky; top: 32px; z-index: 20;
    display: flex; align-items: center; gap: 12px;
    padding: 10px 16px;
    background: rgba(27, 1, 2, .9); backdrop-filter: blur(10px);
    border-bottom: 1px solid var(--line);
  }
  .top__logo { height: 30px; }
  .top__title { flex: 1; min-width: 0; font: 600 22px/1 var(--display); font-stretch: extra-condensed; color: var(--pink); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .top .avatar { width: 36px; height: 36px; font-size: 14px; border: 0; cursor: pointer; }
  .main { padding: 20px 16px 120px; max-width: 760px; margin: 0 auto; }
  .live { display: none; }
  .tabs {
    position: fixed; left: 0; right: 0; bottom: 0; z-index: 25;
    display: grid; grid-template-columns: repeat(5, 1fr);
    padding: 6px 4px calc(6px + env(safe-area-inset-bottom));
    background: rgba(27, 1, 2, .94); backdrop-filter: blur(10px);
    border-top: 1px solid var(--line);
  }
  .tabs a, .nav a {
    position: relative;
    display: flex; flex-direction: column; align-items: center; gap: 3px;
    padding: 6px 2px; border-radius: 12px;
    color: var(--muted); text-decoration: none; font-size: 11.5px; font-weight: 600;
  }
  .tabs a[aria-current="page"], .nav a[aria-current="page"] { color: var(--pink); }
  .tabs a[aria-current="page"] svg { background: rgba(254, 195, 232, .14); border-radius: 99px; width: 48px; padding: 0 12px; }
  .dot { position: absolute; top: 4px; right: calc(50% - 20px); width: 9px; height: 9px; border-radius: 50%; background: var(--warn); box-shadow: 0 0 0 2px var(--bg); }

  /* publish bar */
  .pubbar {
    display: flex; align-items: center; gap: 12px; flex-wrap: wrap;
    margin-bottom: 20px; padding: 12px 14px 12px 16px;
    border-radius: var(--radius);
    background: var(--card); border: 1px solid var(--line);
  }
  .pubbar__text { flex: 1 1 180px; display: flex; align-items: center; gap: 10px; font-size: 14px; }
  .pubbar__text b { display: block; }
  .pubbar__text small { color: var(--muted); }
  .status-dot { width: 10px; height: 10px; border-radius: 50%; background: var(--ok); flex: none; }
  .pubbar.dirty .status-dot { background: var(--warn); box-shadow: 0 0 0 4px rgba(255, 210, 138, .18); }
  .saved { font-size: 12.5px; color: var(--muted); transition: color .3s; }
  @media (max-width: 599px) {
    .pubbar { flex-wrap: nowrap; padding: 10px 10px 10px 14px; gap: 10px; margin-bottom: 14px; }
    .pubbar__text { flex: 1 1 auto; font-size: 13.5px; }
    .pubbar__text small, .pubbar .saved { display: none; }
    .dlg .row > * { flex: 1 1 auto; }
  }
  .saved.flash { color: var(--ok); }

  /* page head */
  .ph { display: flex; align-items: flex-end; justify-content: space-between; gap: 12px; flex-wrap: wrap; margin: 6px 0 18px; }
  .ph h1 { margin: 0; font: 600 clamp(34px, 6vw, 46px)/1 var(--display); font-stretch: extra-condensed; color: var(--pink); }
  .ph p { margin: 6px 0 0; color: var(--muted); }
  .section-title { margin: 28px 0 12px; font-size: 12px; font-weight: 600; letter-spacing: .22em; text-transform: uppercase; color: var(--muted); }

  .card {
    padding: 18px;
    border-radius: var(--radius);
    background: var(--surface); border: 1px solid var(--line);
  }
  .card + .card { margin-top: 14px; }
  .stack { display: flex; flex-direction: column; gap: 16px; }

  /* dashboard */
  .hello { display: flex; align-items: center; gap: 14px; margin: 4px 0 22px; }
  .hello h1 { margin: 0; font: 600 clamp(34px, 7vw, 48px)/1 var(--display); font-stretch: extra-condensed; color: var(--pink); }
  .hello p { margin: 4px 0 0; color: var(--muted); }
  .next {
    position: relative; overflow: hidden;
    display: grid; grid-template-columns: 120px 1fr;
    border-radius: var(--radius); background: var(--card); border: 1px solid var(--line);
    text-decoration: none;
  }
  .next img { width: 100%; height: 100%; object-fit: cover; filter: url(#tone); min-height: 170px; }
  .next__body { padding: 16px 18px; display: flex; flex-direction: column; gap: 6px; }
  .next__body h3 { margin: 0; font: 600 26px/1.05 var(--display); font-stretch: extra-condensed; color: var(--pink); }
  .next__meta { color: var(--muted); font-size: 14px; }
  .countdown { display: flex; align-items: baseline; gap: 6px; margin-top: auto; }
  .countdown b { font: 600 40px/1 var(--display); color: var(--pink); }
  .quick { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-top: 14px; }
  .quick a {
    display: flex; flex-direction: column; gap: 8px;
    padding: 14px; border-radius: var(--radius);
    background: var(--surface); border: 1px solid var(--line);
    text-decoration: none; font-weight: 600; font-size: 14px;
  }
  .quick a:hover, .next:hover, .ev:hover { border-color: var(--line-hi); }
  .quick b { font: 600 30px/1 var(--display); color: var(--pink); }
  .quick span { color: var(--muted); font-weight: 500; font-size: 13px; }
  .log { list-style: none; margin: 0; padding: 0; }
  .log li { display: flex; gap: 12px; align-items: center; padding: 10px 0; }
  .log li + li { border-top: 1px solid var(--line); }
  .log .avatar { width: 32px; height: 32px; font-size: 13px; }
  .log p { margin: 0; flex: 1; }
  .log time { color: var(--muted); font-size: 12.5px; white-space: nowrap; }
  .log .new { color: var(--warn); font-size: 11px; font-weight: 600; letter-spacing: .08em; text-transform: uppercase; }

  /* events */
  .ev-list { display: flex; flex-direction: column; gap: 10px; }
  .ev {
    display: grid; grid-template-columns: 64px 1fr auto; align-items: center; gap: 14px;
    padding: 12px 14px 12px 12px;
    border-radius: var(--radius); background: var(--surface); border: 1px solid var(--line);
    text-decoration: none;
  }
  .ev.draft { border-style: dashed; }
  .date-badge {
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    height: 64px; border-radius: 12px; background: var(--card);
    color: var(--pink); line-height: 1;
  }
  .date-badge b { font: 600 28px/1 var(--display); font-stretch: condensed; }
  .date-badge span { font-size: 11px; letter-spacing: .14em; text-transform: uppercase; margin-top: 3px; }
  .ev h3 { margin: 0 0 3px; font-size: 16px; font-weight: 600; color: var(--text); }
  .ev p { margin: 0; color: var(--muted); font-size: 13.5px; }
  .chips { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; }
  .chip { display: inline-flex; align-items: center; gap: 5px; padding: 2px 9px; border-radius: 99px; font-size: 11.5px; font-weight: 600; background: var(--card); color: var(--pink); }
  .chip.ok { background: rgba(166, 232, 191, .12); color: var(--ok); }
  .chip.warn { background: rgba(255, 210, 138, .12); color: var(--warn); }
  .chip.bad { background: rgba(255, 133, 151, .12); color: var(--danger); }
  .chip.star::before { content: "★"; }
  .empty { padding: 32px 16px; text-align: center; color: var(--muted); border: 1px dashed var(--line); border-radius: var(--radius); }

  .back { display: inline-flex; align-items: center; gap: 6px; margin-bottom: 8px; color: var(--muted); text-decoration: none; font-weight: 600; font-size: 14px; }
  .back:hover { color: var(--pink); }
  .photo-pick { display: grid; grid-template-columns: repeat(auto-fill, minmax(76px, 1fr)); gap: 8px; }
  .photo-pick button { position: relative; padding: 0; aspect-ratio: 1; border-radius: 10px; overflow: hidden; border: 2px solid transparent; background: var(--card); }
  .photo-pick button[aria-pressed="true"] { border-color: var(--pink); }
  .photo-pick button[aria-pressed="true"]::after { content: "✓"; position: absolute; top: 4px; right: 4px; width: 22px; height: 22px; border-radius: 50%; background: var(--pink); color: var(--bg); font-weight: 700; font-size: 13px; display: grid; place-items: center; }
  .photo-pick img { width: 100%; height: 100%; object-fit: cover; filter: url(#tone); }
  .actions { display: flex; flex-wrap: wrap; gap: 10px; justify-content: space-between; margin-top: 22px; }

  /* gallery */
  .drop {
    display: flex; flex-direction: column; align-items: center; gap: 8px;
    padding: 22px 16px; margin-bottom: 16px;
    border: 1.5px dashed var(--line-hi); border-radius: var(--radius);
    text-align: center; color: var(--muted); cursor: pointer;
    transition: background .15s, border-color .15s;
  }
  .drop b { color: var(--pink); font-size: 16px; }
  .drop.over { background: rgba(254, 195, 232, .08); border-color: var(--pink); }
  .drop svg { width: 30px; height: 30px; color: var(--pink); }
  .gal { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(46%, 170px), 1fr)); gap: 10px; }
  .ph-item {
    position: relative; padding: 0; border: 1px solid var(--line); border-radius: 14px; overflow: hidden;
    background: var(--surface); text-align: left; color: var(--text);
    aspect-ratio: 4 / 5;
  }
  .ph-item img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
  .ph-item.tone img { filter: url(#tone); }
  .ph-item.hidden img { opacity: .35; }
  .ph-item .cap {
    position: absolute; left: 0; right: 0; bottom: 0;
    padding: 28px 10px 9px; font-size: 12.5px; font-weight: 500;
    background: linear-gradient(transparent, rgba(27, 1, 2, .92));
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }
  .ph-item .num { position: absolute; top: 8px; left: 8px; min-width: 24px; height: 24px; padding: 0 7px; border-radius: 99px; background: rgba(27, 1, 2, .8); font-size: 12px; font-weight: 600; display: grid; place-items: center; }
  .ph-item .flag { position: absolute; top: 8px; right: 8px; }
  .ph-item.dragging { opacity: .4; }
  .ph-item.drag-over { outline: 2px solid var(--pink); outline-offset: 2px; }

  /* dialog / sheet */
  dialog {
    width: min(100% - 24px, 520px); max-height: calc(100svh - 32px);
    padding: 0; border: 1px solid var(--line-hi); border-radius: 22px;
    background: var(--surface); color: var(--text);
    overflow: auto;
  }
  dialog::backdrop { background: rgba(10, 0, 1, .72); backdrop-filter: blur(3px); }
  .dlg { padding: 22px; display: flex; flex-direction: column; gap: 16px; }
  .dlg h2 { margin: 0; font: 600 30px/1 var(--display); font-stretch: extra-condensed; color: var(--pink); }
  .dlg p { margin: 0; color: var(--muted); }
  .dlg .row { display: flex; gap: 10px; justify-content: flex-end; flex-wrap: wrap; }
  .dlg__img { margin: -22px -22px 0; background: #000; }
  .dlg__img img { display: block; width: 100%; max-height: 46svh; object-fit: contain; }
  .dlg__img.tone img { filter: url(#tone); }
  .changes { list-style: none; margin: 0; padding: 0; max-height: 220px; overflow: auto; }
  .changes li { display: flex; gap: 10px; align-items: center; padding: 7px 0; font-size: 14px; }
  .changes .avatar { width: 26px; height: 26px; font-size: 11px; }
  .spinner { width: 46px; height: 46px; border-radius: 50%; border: 3px solid var(--card-hi); border-top-color: var(--pink); animation: spin .8s linear infinite; margin: 10px auto; }
  @keyframes spin { to { rotate: 1turn; } }
  .done-mark { width: 64px; height: 64px; margin: 6px auto; border-radius: 50%; background: var(--pink); color: var(--bg); display: grid; place-items: center; font-size: 34px; font-weight: 700; animation: pop .35s cubic-bezier(.3, 1.6, .5, 1); }
  @keyframes pop { from { scale: .3; opacity: 0; } }

  .menu { position: fixed; z-index: 40; top: 92px; right: 12px; min-width: 230px; padding: 8px; border-radius: 16px; background: var(--card); border: 1px solid var(--line-hi); box-shadow: 0 20px 50px rgba(0, 0, 0, .5); }
  .menu .who-line { display: flex; gap: 10px; align-items: center; padding: 8px 10px 12px; border-bottom: 1px solid var(--line); margin-bottom: 6px; }
  .menu .who-line small { display: block; color: var(--muted); }
  .menu button { display: flex; align-items: center; gap: 10px; width: 100%; padding: 10px; border: 0; border-radius: 10px; background: none; text-align: left; }
  .menu button:hover { background: rgba(254, 195, 232, .08); }

  .toast {
    position: fixed; z-index: 60; left: 50%; bottom: 92px; translate: -50% 20px;
    padding: 11px 18px; border-radius: 999px;
    background: var(--pink); color: var(--bg); font-weight: 600; font-size: 14px;
    opacity: 0; pointer-events: none; transition: opacity .2s, translate .2s;
    max-width: calc(100% - 32px); text-align: center;
  }
  .toast.show { opacity: 1; translate: -50% 0; }

  /* preview */
  .pv-tools { display: flex; align-items: center; justify-content: space-between; gap: 10px; flex-wrap: wrap; margin-bottom: 14px; }
  .pv-wrap { display: flex; justify-content: center; }
  .pv-frame { width: 100%; height: 70svh; border: 1px solid var(--line-hi); border-radius: 18px; background: var(--bg); }
  .pv-wrap.mobile .pv-frame { width: 390px; max-width: 100%; height: 760px; max-height: 75svh; border-radius: 34px; border-width: 8px; border-color: #3a1418; }

  /* desktop */
  @media (min-width: 960px) {
    .shell { display: grid; grid-template-columns: 240px minmax(0, 1fr); }
    .tabs { display: none; }
    .top { display: none; }
    .side {
      position: sticky; top: 32px; height: calc(100svh - 32px);
      display: flex; flex-direction: column; gap: 22px;
      padding: 24px 16px 18px;
      border-right: 1px solid var(--line);
    }
    .side__logo { width: 150px; margin: 4px 8px 6px; }
    .nav { display: flex; flex-direction: column; gap: 4px; }
    .nav a { flex-direction: row; gap: 12px; padding: 11px 14px; font-size: 15px; }
    .nav a:hover { background: rgba(254, 195, 232, .06); color: var(--pink); }
    .nav a[aria-current="page"] { background: var(--card); }

}
function fmtTime(t) {

let pvT;
function schedulePreview() { clearTimeout(pvT); pvT = setTimeout(refreshPreview, 300); }
function refreshPreview() {
  const html = siteHTML();
  $$('.pv-frame').forEach(fr => {
    if (fr.dataset.html === html) return;
    // first load jumps to the section being edited, later updates keep the scroll position
    const first = !fr.dataset.html;
    let y = 0;
    try { y = fr.contentWindow.scrollY; } catch (e) {}
    const anchor = { texty: 'o-nas', galerie: 'galerie' }[route().page];
    fr.onload = () => {
      try {
        const w = fr.contentWindow, a = anchor && w.document.getElementById(anchor);
        if (first && a) w.scrollTo(0, a.offsetTop - 10); else w.scrollTo(0, y);
      } catch (e) {}
    };
    fr.dataset.html = html;
    fr.srcdoc = html;
  });
}

/* ---------------- render ---------------- */
function render() {
  const app = $('#app');
  closeMenu();
  if (!me) { app.innerHTML = viewLogin(); return; }
  const r = route();
  if (r.page === 'akce' && r.id === 'new') { newEvent(); return; }
  const inner = r.page === 'akce' ? (r.id ? viewEventEdit(r.id) : viewEvents())
    : r.page === 'texty' ? viewTexts()
    : r.page === 'galerie' ? viewGallery()
    : r.page === 'nahled' ? viewPreview()
    : viewDashboard();
  app.innerHTML = viewShell(r, inner);
  document.title = `${TITLES[r.page]} · Divoce! administrace`;
  updateChrome();
  refreshPreview();
  if (r.page === 'texty') seoCount();
  if (r.page === 'galerie') bindGallery();
  window.scrollTo(0, 0);
}

function newEvent() {
  const f = featured();
  const e = {
    id: uid('e'), label: 'Koncert', title: '', date: '', time: '20:00', venue: '', address: '',
    presale: '', door: '', ticketUrl: '', status: 'prodej', photo: S.gallery[0]?.id || '',
    published: false, featured: !f,
  };
  S.events.push(e);
  changed('přidala novou akci', 'ev-new-' + e.id);
  location.replace('#/akce/' + e.id);
}

function seoCount() {
  const c = $('#seo-c'); if (!c) return;
  const n = S.texts.seo.length;
  c.textContent = `${n} / 160`; c.classList.toggle('over', n > 160);
}

/* ---------------- interactions ---------------- */
document.addEventListener('click', ev => {
  const t = ev.target.closest('[data-pick],[data-act],[data-evtab],[data-pickphoto],[data-pv],[data-ph]');
  if (!t) { if (!ev.target.closest('.menu')) closeMenu(); return; }
  if (t.dataset.pick) {
    loginPick = t.dataset.pick;
    $$('[data-pick]').forEach(b => b.setAttribute('aria-pressed', b === t));
    $('#login-mail').value = loginPick + '@divoceduo.cz';
  } else if (t.dataset.evtab) {
    evTab = t.dataset.evtab; render();
  } else if (t.dataset.pv) {
    pvMode = t.dataset.pv;
    $$('[data-pv]').forEach(b => b.setAttribute('aria-pressed', b === t));
    $('.pv-wrap').className = 'pv-wrap ' + pvMode;
  } else if (t.dataset.pickphoto) {
    const e = curEvent(); e.photo = t.dataset.pickphoto;
    $$('[data-pickphoto]').forEach(b => b.setAttribute('aria-pressed', b === t));
    changed(`změnila fotku u akce „${e.title || 'bez názvu'}“`, 'ev-photo-' + e.id);
  } else if (t.dataset.ph) {
    if (!dragJustEnded) photoDialog(t.dataset.ph);
  } else act(t.dataset.act, t);
});

function act(a) {
  if (a === 'menu') return toggleMenu();
  if (a === 'logout') { me = null; try { localStorage.removeItem(USER_KEY); } catch (e) {} location.hash = ''; render(); return; }
  if (a === 'reset') {
    return confirmDlg('Obnovit ukázku?', 'Všechny vaše úpravy v tomto prohlížeči se zahodí a vrátí se původní obsah.', 'Obnovit', () => {
      S = seed(); persist(); render(); toast('Ukázka obnovena');
    });
  }
  if (a === 'publish') return publishDlg();
  if (a === 'open-pv') {
    const url = URL.createObjectURL(new Blob([siteHTML()], { type: 'text/html' }));
    window.open(url, '_blank');
    return;
  }
  if (a === 'del-ev') {
    const e = curEvent();
    return confirmDlg('Smazat akci?', `„${e.title || 'Bez názvu'}“ zmizí z webu i z administrace.`, 'Smazat', () => {
      S.events = S.events.filter(x => x !== e);
      changed(`smazala akci „${e.title || 'bez názvu'}“`, 'ev-del-' + e.id);
      location.hash = '#/akce'; toast('Akce smazána');
    }, true);
  }
  if (a === 'dup-ev') {
    const e = curEvent();
    const c = { ...e, id: uid('e'), title: e.title + ' (kopie)', published: false, featured: false };
    S.events.push(c);
    changed(`zkopírovala akci „${e.title}“`, 'ev-dup-' + c.id);
    location.hash = '#/akce/' + c.id; toast('Kopie vytvořena jako koncept');
  }
}

function curEvent() { const id = $('[data-ev]')?.dataset.ev; return S.events.find(e => e.id === id); }

document.addEventListener('submit', ev => {
  if (ev.target.id !== 'login-form') return;
  ev.preventDefault();
  me = loginPick;
  try { localStorage.setItem(USER_KEY, me); } catch (e) {}
  location.hash = '#/prehled';
  render();
  toast(`Vítej, ${USERS[me].name}!`);
});

const FIELD_NAMES = { label: 'štítek', title: 'název', date: 'datum', time: 'čas', venue: 'místo', address: 'adresu', status: 'stav vstupenek', presale: 'cenu', door: 'cenu', ticketUrl: 'odkaz na vstupenky' };
const TEXT_NAMES = { lead: 'hlavní větu „O nás“', names: 'jména', body: 'text „O nás“', outro: 'závěrečnou větu', instagram: 'odkaz na Instagram', facebook: 'odkaz na Facebook', seo: 'popis webu' };

document.addEventListener('input', ev => {
  const el = ev.target;
  if (el.dataset.f && !['published', 'featured'].includes(el.dataset.f)) {
    const e = curEvent(); const k = el.dataset.f;
    e[k] = el.type === 'number' ? (el.value === '' ? '' : +el.value) : el.value;
    if (k === 'title') $('#ev-h').textContent = el.value || 'Nová akce';
    changed(`upravila ${FIELD_NAMES[k]} u akce „${e.title || 'bez názvu'}“`, 'ev-' + e.id + '-' + k);
  } else if (el.dataset.t) {
    S.texts[el.dataset.t] = el.value;
    if (el.dataset.t === 'seo') seoCount();
    changed(`upravila ${TEXT_NAMES[el.dataset.t]}`, 'txt-' + el.dataset.t);
  }
});
document.addEventListener('change', ev => {
  const el = ev.target;
  if (el.dataset.f === 'published' || el.dataset.f === 'featured') {
    const e = curEvent();
    e[el.dataset.f] = el.checked;
    if (el.dataset.f === 'featured' && el.checked) {
      S.events.forEach(x => { if (x !== e) x.featured = false; });
      if (!e.published) { e.published = true; $('[data-f="published"]').checked = true; toast('Hlavní akce musí být zveřejněná – zapnuto.'); }
    }
    if (el.dataset.f === 'published' && !el.checked && e.featured) { e.featured = false; $('[data-f="featured"]').checked = false; }
    const what = el.dataset.f === 'published'
      ? (el.checked ? `zveřejnila akci „${e.title || 'bez názvu'}“` : `skryla akci „${e.title || 'bez názvu'}“`)
      : (el.checked ? `dala akci „${e.title || 'bez názvu'}“ na úvod` : `sundala akci „${e.title || 'bez názvu'}“ z úvodu`);
    changed(what, 'ev-' + e.id + '-' + el.dataset.f);
  }
  if (el.id === 'file') { addFiles(el.files); el.value = ''; }
});

/* ---------------- account menu ---------------- */
function toggleMenu() {
  if ($('.menu')) return closeMenu();
  const m = document.createElement('div');
  m.className = 'menu';
  m.innerHTML = `<div class="who-line">${avatar(me)}<span><b>${esc(USERS[me].full)}</b><small>${me}@divoceduo.cz</small></span></div>
    <button type="button" data-act="reset">${icon('reset')}Obnovit ukázku</button>
    <button type="button" data-act="logout">${icon('out')}Odhlásit se</button>`;
  document.body.append(m);
}
function closeMenu() { $('.menu')?.remove(); }

/* ---------------- dialogs ---------------- */
const dlg = $('#dlg');
function openDlg(html) { dlg.innerHTML = html; if (!dlg.open) dlg.showModal(); }
dlg.addEventListener('click', e => { if (e.target === dlg) dlg.close(); });

function confirmDlg(title, text, okLabel, onOk, danger) {
  openDlg(`<div class="dlg"><h2>${esc(title)}</h2><p>${esc(text)}</p>
    <div class="row"><button class="btn" type="button" data-close>Zpět</button><button class="btn ${danger ? 'danger' : 'primary'}" type="button" data-ok>${esc(okLabel)}</button></div></div>`);
  $('[data-close]', dlg).onclick = () => dlg.close();
  $('[data-ok]', dlg).onclick = () => { dlg.close(); onOk(); };
}

function publishDlg() {
  const items = pendingLog();
  openDlg(`<div class="dlg"><h2>Zveřejnit změny?</h2>
    <p>Po zveřejnění je uvidí všichni na divoceduo.cz.</p>
    <ul class="changes">${items.map(l => `<li>${avatar(l.who)}<span><b>${USERS[l.who]?.name}</b> ${esc(l.what)}</span></li>`).join('') || '<li>Drobné úpravy</li>'}</ul>
    <div class="row"><button class="btn" type="button" data-close>Ještě ne</button><a class="btn" href="#/nahled" data-close>${icon('eye')}Náhled</a><button class="btn primary" type="button" data-ok>${icon('send')}Zveřejnit</button></div></div>`);
  $$('[data-close]', dlg).forEach(b => b.addEventListener('click', () => dlg.close()));
  $('[data-ok]', dlg).onclick = () => {
    openDlg('<div class="dlg" style="text-align:center"><div class="spinner"></div><h2>Zveřejňuji…</h2><p>Nahrávám změny na web.</p></div>');
    setTimeout(() => {
      S.snap = snapshot(S);
      S.publishedAt = Date.now();
      log('zveřejnila změny na webu', 'pub-' + Date.now());
      S.publishedAt = Date.now() + 1;
      persist();
      openDlg(`<div class="dlg" style="text-align:center"><div class="done-mark">✓</div><h2>Hotovo, je to venku!</h2>
        <p>V ostré verzi by teď byl web aktualizovaný do minuty. V ukázce se skutečný web nemění.</p>
        <div class="row" style="justify-content:center"><button class="btn primary" type="button" data-close>Super</button></div></div>`);
      $('[data-close]', dlg).onclick = () => dlg.close();
      render();
    }, 1600);
  };
}

function photoDialog(id) {
  const g = photo(id); if (!g) return;
  const i = S.gallery.indexOf(g);
  openDlg(`<div class="dlg">
    <div class="dlg__img ${g.tone ? 'tone' : ''}"><img src="${esc(g.src)}" alt=""></div>
    <label class="field"><span>Popisek</span><input class="input" id="cap" value="${esc(g.caption)}" placeholder="Co je na fotce?"><small>Čtou ho vyhledávače a nevidomí.</small></label>
    <div>
      <label class="switch"><span><b>Zobrazit na webu</b></span><input type="checkbox" id="pub" ${g.published ? 'checked' : ''}></label>
      <label class="switch"><span><b>Barvy webu</b><small>Přebarví fotku do růžovo-vínové jako na úvodu.</small></span><input type="checkbox" id="tone" ${g.tone ? 'checked' : ''}></label>
    </div>
    <div class="row" style="justify-content:space-between">
      <span style="display:flex;gap:8px">
        <button class="icon-btn" type="button" data-move="-1" ${i === 0 ? 'disabled' : ''} aria-label="Posunout dopředu">${icon('left')}</button>
        <button class="icon-btn" type="button" data-move="1" ${i === S.gallery.length - 1 ? 'disabled' : ''} aria-label="Posunout dozadu">${icon('right')}</button>
      </span>
      <span style="display:flex;gap:8px"><button class="btn danger small" type="button" data-del>${icon('trash')}Smazat</button><button class="btn primary small" type="button" data-close>Hotovo</button></span>
    </div></div>`);
  const upd = what => { changed(what, 'ph-' + g.id + '-' + what.slice(0, 12)); };
  $('#cap', dlg).oninput = e => { g.caption = e.target.value; upd('upravila popisek fotky'); };
  $('#pub', dlg).onchange = e => { g.published = e.target.checked; upd(g.published ? 'zobrazila fotku v galerii' : 'skryla fotku z galerie'); };
  $('#tone', dlg).onchange = e => { g.tone = e.target.checked; $('.dlg__img', dlg).classList.toggle('tone', g.tone); upd('změnila barvy fotky'); };
  $$('[data-move]', dlg).forEach(b => b.onclick = () => {
    const j = i + +b.dataset.move;
    S.gallery.splice(i, 1); S.gallery.splice(j, 0, g);
    changed('změnila pořadí fotek', 'ph-order');
    render(); photoDialog(id);
  });
  $('[data-del]', dlg).onclick = () => {
    S.gallery = S.gallery.filter(x => x !== g);
    S.events.forEach(e => { if (e.photo === g.id) e.photo = S.gallery[0]?.id || ''; });
    changed('smazala fotku z galerie', 'ph-del-' + g.id);
    dlg.close(); render(); toast('Fotka smazána');
  };
  $('[data-close]', dlg).onclick = () => dlg.close();
}
dlg.addEventListener('close', () => { if (route().page === 'galerie' && me) render(); });

/* ---------------- gallery: upload + drag reorder ---------------- */
function loadImage(file) {
  return new Promise((res, rej) => {
    const url = URL.createObjectURL(file);
    const img = new Image();
    img.onload = () => res({ img, url });
    img.onerror = () => rej(new Error('Nelze načíst ' + file.name));
    img.src = url;
  });
}
async function addFiles(files) {
  const list = [...files].filter(f => f.type.startsWith('image/'));
  if (!list.length) return;
  toast(`Nahrávám ${list.length} ${list.length === 1 ? 'fotku' : list.length < 5 ? 'fotky' : 'fotek'}…`);
  let ok = 0;
  for (const f of list) {
    try {
      const { img, url } = await loadImage(f);
      const max = 1200, k = Math.min(1, max / Math.max(img.naturalWidth, img.naturalHeight));
      const c = document.createElement('canvas');
      c.width = Math.round(img.naturalWidth * k); c.height = Math.round(img.naturalHeight * k);
      c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
      URL.revokeObjectURL(url);
      const g = { id: uid('g'), src: c.toDataURL('image/jpeg', .8), caption: f.name.replace(/\.[^.]+$/, '').replace(/[-_]+/g, ' '), published: true, tone: false };
      S.gallery.unshift(g);
      if (!persist()) { S.gallery.shift(); break; }
      ok++;
    } catch (e) { toast(e.message); }
  }
  if (ok) { changed(`přidala ${ok} ${ok === 1 ? 'fotku' : ok < 5 ? 'fotky' : 'fotek'} do galerie`, 'ph-add-' + Date.now()); render(); toast('Fotky přidány'); }
}

let dragId = null, dragJustEnded = false;
function bindGallery() {
  const drop = $('#drop');
  ['dragenter', 'dragover'].forEach(n => drop.addEventListener(n, e => { if (dragId) return; e.preventDefault(); drop.classList.add('over'); }));
  ['dragleave', 'drop'].forEach(n => drop.addEventListener(n, () => drop.classList.remove('over')));
  drop.addEventListener('drop', e => { if (dragId) return; e.preventDefault(); addFiles(e.dataTransfer.files); });
  $$('[data-ph]').forEach(el => {
    el.addEventListener('dragstart', e => { dragId = el.dataset.ph; el.classList.add('dragging'); e.dataTransfer.effectAllowed = 'move'; e.dataTransfer.setData('text/plain', dragId); });
    el.addEventListener('dragend', () => { dragId = null; el.classList.remove('dragging'); dragJustEnded = true; setTimeout(() => dragJustEnded = false, 50); });
    el.addEventListener('dragover', e => { if (!dragId) return; e.preventDefault(); el.classList.add('drag-over'); });
    el.addEventListener('dragleave', () => el.classList.remove('drag-over'));
    el.addEventListener('drop', e => {
      if (!dragId) return;
      e.preventDefault();
      const from = S.gallery.findIndex(g => g.id === dragId), to = S.gallery.findIndex(g => g.id === el.dataset.ph);
      if (from < 0 || from === to) return;
      const [g] = S.gallery.splice(from, 1); S.gallery.splice(to, 0, g);
      changed('změnila pořadí fotek', 'ph-order');
      render();
    });
  });
}

window.addEventListener('hashchange', render);
render();
</script>
